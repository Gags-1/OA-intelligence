services:
  postgres:
    image: postgres:16
    container_name: oa-intelligence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oa_user
      POSTGRES_PASSWORD: oa_password
      POSTGRES_DB: oa_intelligence
    ports:
      - "5433:5432"
    volumes:
      - oa_postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: oa-intelligence-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - oa_qdrant_data:/qdrant/storage

volumes:
  oa_postgres_data:
  oa_qdrant_data:
